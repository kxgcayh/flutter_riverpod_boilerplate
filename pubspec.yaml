# Flutter 3.44.9 - Dart 3.12.2
name: flutter_boilerplate
description: "A production-ready Flutter starter boilerplate template based on flutter-expert architectural standards."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  hooks_riverpod: ^3.4.2
  flutter_hooks: ^0.21.3+1
  dio: ^5.11.0
  logger: ^2.7.0
