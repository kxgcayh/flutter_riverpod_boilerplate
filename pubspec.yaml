    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
  go_router_builder: ^4.4.1

flutter:
  uses-material-design: true
